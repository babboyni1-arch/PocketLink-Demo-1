name: PocketLink Debug APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        id: verify-java
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | head -n 1 | cut -d'"' -f2 | cut -d'.' -f1)
          if [[ "$JAVA_VERSION" == *"."* ]]; then
            JAVA_VERSION=$(echo "$JAVA_VERSION" | cut -d'.' -f1)
          fi
          echo "Detected Java Major Version: $JAVA_VERSION"
          if [ "$JAVA_VERSION" -ne 17 ] && [ "$JAVA_VERSION" -ne 21 ]; then
            echo "❌ Incompatible Java version detected! Expected Java 17 or 21."
            exit 1
          fi
          echo "Java environment verified successfully for PocketLink."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure debug keystore
        run: |
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            echo "Restoring debug keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating runner temporary debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Debug keystore is present."
          fi

      - name: Build PocketLink Debug APK
        id: build-apk
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:assembleDebug
          else
            gradle :app:assembleDebug
          fi

      - name: Detect and verify APK
        id: verify-apk
        run: |
          echo "Locating built debug APK..."
          APK_DIR="app/build/outputs/apk/debug"
          if [ ! -d "$APK_DIR" ]; then
            echo "❌ Directory $APK_DIR does not exist."
            echo "Discovered APK files in build folder:"
            find app/build -name "*.apk" || true
            exit 1
          fi

          APK_PATH=$(find "$APK_DIR" -maxdepth 2 -name "*.apk" ! -name "*androidTest*" ! -name "*test*" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ No debug APK found in $APK_DIR."
            echo "Discovered APK files in build folder:"
            find app/build -name "*.apk" || true
            exit 1
          fi

          echo "Found APK candidate: $APK_PATH"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ Path is not a regular file: $APK_PATH"
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "❌ APK file is empty: $APK_PATH"
            exit 1
          fi

          if [[ "$APK_PATH" != *.apk ]]; then
            echo "❌ File does not have .apk extension: $APK_PATH"
            exit 1
          fi

          echo "APK successfully verified!"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

          # Prepare named release asset
          RELEASE_APK="pocketlink-debug-build-${{ github.run_number }}.apk"
          cp "$APK_PATH" "$RELEASE_APK"
          echo "Prepared release asset: $RELEASE_APK"
          echo "RELEASE_APK_PATH=$RELEASE_APK" >> $GITHUB_ENV

      - name: Upload PocketLink Debug APK Artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketlink-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI version..."
          gh --version

          RELEASE_TAG="pocketlink-debug-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="PocketLink Debug APK Build #${{ github.run_number }}"
          RELEASE_ASSET="${{ env.RELEASE_APK_PATH }}"

          echo "Verifying release asset..."
          if [ ! -f "$RELEASE_ASSET" ] || [ ! -s "$RELEASE_ASSET" ]; then
            echo "❌ Release asset is invalid or missing: $RELEASE_ASSET"
            exit 1
          fi

          echo "Creating GitHub Release $RELEASE_TAG and attaching $RELEASE_ASSET..."
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --notes "### PocketLink Debug APK Build

This is an automatically generated debug APK build for PocketLink, built by GitHub Actions.

- **Workflow Run Number:** ${{ github.run_number }}
- **Workflow Run Attempt:** ${{ github.run_attempt }}
- **Source Commit SHA:** \`${{ github.sha }}\`
- **Signing Status:** Debug-signed with Android debug keystore
- **Distribution Notice:** This build is intended for testing and development. It is NOT a Play Store production release.

Directly download and install \`${RELEASE_ASSET}\` on your Android device."

      - name: Create Job Summary
        if: always()
        run: |
          echo "## PocketLink Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.build-apk.outcome }}" == "success" ]; then
            echo "✅ **APK Build:** Success" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **APK Build:** Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.upload-artifact.outcome }}" == "success" ]; then
            echo "✅ **Actions Artifact:** Created successfully (\`pocketlink-debug-apk\`)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Actions Artifact:** Failed" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.publish-release.outcome }}" == "success" ]; then
            echo "✅ **GitHub Release:** Published successfully!" >> $GITHUB_STEP_SUMMARY
            echo "🔗 **Release URL:** [View Release and Download APK](https://github.com/${{ github.repository }}/releases/tag/pocketlink-debug-build-${{ github.run_number }}-${{ github.run_attempt }})" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **GitHub Release:** Failed to publish release." >> $GITHUB_STEP_SUMMARY
            echo "ℹ️ **Fallback Actions Artifact:** The debug APK was successfully built and uploaded as a GitHub Actions artifact (\`pocketlink-debug-apk\`). You can download it directly from this workflow run's Artifacts section even though release publishing did not complete." >> $GITHUB_STEP_SUMMARY
          fi
